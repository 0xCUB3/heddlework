<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <title>Heddlework — agent work woven across Pi, Codex, Claude, and future harnesses</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#20262f" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c24"/>
      <stop offset="1" stop-color="#0f1319"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="16" fill="#0b0f14"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)" opacity="0.55"/>
  <rect x="18" y="18" width="1164" height="324" rx="13" fill="none" stroke="#2b323d"/>

  <text x="54" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8" fill="#6f7885">HARNESS ADAPTERS</text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" dur=".45s" begin=".2s" fill="freeze"/>
    <rect x="54" y="78" width="238" height="54" rx="11" fill="#151b23" stroke="#8b5cf6" stroke-opacity=".7"/>
    <circle cx="79" cy="105" r="7" fill="#8b5cf6"/>
    <text x="99" y="102" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">Pi</text>
    <text x="99" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#a78bfa">READY NOW</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" dur=".45s" begin=".4s" fill="freeze"/>
    <rect x="54" y="146" width="238" height="54" rx="11" fill="#12171e" stroke="#303844"/>
    <circle cx="79" cy="173" r="7" fill="#58a6ff" opacity=".65"/>
    <text x="99" y="170" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#c9d1d9">Codex</text>
    <text x="99" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6f7885">ADAPTER PLANNED</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" dur=".45s" begin=".6s" fill="freeze"/>
    <rect x="54" y="214" width="238" height="54" rx="11" fill="#12171e" stroke="#303844"/>
    <circle cx="79" cy="241" r="7" fill="#e3b341" opacity=".65"/>
    <text x="99" y="238" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#c9d1d9">Claude</text>
    <text x="99" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6f7885">ADAPTER PLANNED</text>
  </g>

  <path id="pi-thread" d="M292 105 C350 105 356 140 416 140" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 7">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path id="codex-thread" d="M292 173 C350 173 356 170 416 170" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 8" opacity=".65">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path id="claude-thread" d="M292 241 C350 241 356 200 416 200" fill="none" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4 8" opacity=".65">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".5s" begin=".75s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur=".55s" begin=".75s" fill="freeze"/>
    <rect x="416" y="45" width="370" height="270" rx="16" fill="url(#panel)" stroke="#46505f"/>
    <rect x="438" y="67" width="34" height="34" rx="9" fill="#202837" stroke="#8b5cf6" stroke-opacity=".65"/>
    <text x="455" y="90" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#a78bfa">H</text>
    <text x="486" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="720" fill="#f0f3f6">Heddlework</text>
    <rect x="669" y="72" width="93" height="24" rx="12" fill="#2a2110" stroke="#f59e0b" stroke-opacity=".45"/>
    <text x="715.5" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#fbbf24">PREVIEW</text>

    <line x1="438" y1="118" x2="764" y2="118" stroke="#2b323d"/>
    <rect x="438" y="136" width="145" height="68" rx="10" fill="#11161c" stroke="#28313d"/>
    <text x="455" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#737d8c">SESSION</text>
    <text x="455" y="184" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="620" fill="#dce2e8">Build and steer</text>
    <rect x="599" y="136" width="165" height="68" rx="10" fill="#11161c" stroke="#28313d"/>
    <text x="616" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#737d8c">REVIEW</text>
    <text x="616" y="184" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="620" fill="#dce2e8">Diffs + artifacts</text>

    <rect x="438" y="220" width="326" height="70" rx="10" fill="#11161c" stroke="#28313d"/>
    <circle cx="459" cy="244" r="5" fill="#3fb950"/>
    <line x1="474" y1="244" x2="618" y2="244" stroke="#56606d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="459" cy="266" r="5" fill="#58a6ff"/>
    <line x1="474" y1="266" x2="696" y2="266" stroke="#39424e" stroke-width="5" stroke-linecap="round"/>
    <rect x="717" y="238" width="29" height="34" rx="7" fill="#1f2937"/>
    <path d="M724 255h15M731.5 247.5v15" stroke="#a5b4fc" stroke-width="1.5"/>
  </g>

  <path id="session-out" d="M786 135 C842 135 848 104 908 104" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-dasharray="6 7">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.35s" repeatCount="indefinite"/>
  </path>
  <path id="graph-out" d="M786 180 C842 180 848 180 908 180" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-dasharray="6 7">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path id="review-out" d="M786 225 C842 225 848 256 908 256" fill="none" stroke="#f778ba" stroke-width="1.7" stroke-dasharray="6 7">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.65s" repeatCount="indefinite"/>
  </path>

  <text x="908" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8" fill="#6f7885">ONE WORKSPACE</text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin="1.15s" fill="freeze"/>
    <rect x="908" y="78" width="238" height="52" rx="11" fill="#131a20" stroke="#3fb950" stroke-opacity=".45"/>
    <text x="932" y="109" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="640" fill="#dce2e8">Durable sessions</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin="1.3s" fill="freeze"/>
    <rect x="908" y="154" width="238" height="52" rx="11" fill="#131a20" stroke="#58a6ff" stroke-opacity=".45"/>
    <text x="932" y="185" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="640" fill="#dce2e8">Dependency-aware work</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin="1.45s" fill="freeze"/>
    <rect x="908" y="230" width="238" height="52" rx="11" fill="#131a20" stroke="#f778ba" stroke-opacity=".45"/>
    <text x="932" y="261" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="640" fill="#dce2e8">Review + artifacts</text>
  </g>

  <g filter="url(#glow)">
    <circle r="4" fill="#8b5cf6"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pi-thread"/></animateMotion></circle>
    <circle r="3" fill="#3fb950"><animateMotion dur="2.45s" begin=".7s" repeatCount="indefinite"><mpath href="#session-out"/></animateMotion></circle>
    <circle r="3" fill="#58a6ff"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite"><mpath href="#graph-out"/></animateMotion></circle>
    <circle r="3" fill="#f778ba"><animateMotion dur="2.75s" begin="1.5s" repeatCount="indefinite"><mpath href="#review-out"/></animateMotion></circle>
  </g>

  <text x="600" y="334" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#66707d">Pi first · Codex and Claude next · desktop now · web and mobile later</text>
</svg>
