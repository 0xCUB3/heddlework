apple-system, Segoe UI, sans-serif" font-size="15" font-weight="640">Review + artifacts</text></g><g filter="url(#glow)"><circle r="4" fill="#8b5cf6"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pi-thread"/></animateMotion></circle><circle r="3" fill="#3fb950"><animateMotion begin=".7s" dur="2.45s" repeatCount="indefinite"><mpath href="#session-out"/></animateMotion></circle><circle r="3" fill="#58a6ff"><animateMotion begin="1.1s" dur="2.6s" repeatCount="indefinite"><mpath href="#graph-out"/></animateMotion></circle><circle r="3" fill="#f778ba"><animateMotion begin="1.5s" dur="2.75s" repeatCount="indefinite"><mpath href="#review-out"/></animateMotion></circle></g><text x="600" y="334" fill="#66707d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Pi first · Codex and Claude next · desktop now · web and mobile later</text></svg>