<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290"><title>Heddlework architecture — surfaces, workspace core, and harness adapters</title><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#27303b"/></pattern><filter id="pulse" width="500%" height="500%" x="-200%" y="-200%"><feGaussianBlur result="b" stdDeviation="2.4"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="290" fill="#0d1117" rx="14"/><rect width="1200" height="290" fill="url(#dots)" rx="14"/><text x="52" y="39" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">SURFACES</text><g fill="#d8dee4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14"><rect width="190" height="44" x="52" y="58" fill="#161b22" stroke="#30363d" rx="10"/><text x="75" y="85">Native desktop</text><rect width="190" height="44" x="52" y="120" fill="#12171d" stroke="#30363d" rx="10"/><text x="75" y="147" fill="#8b949e">Web · planned</text><rect width="190" height="44" x="52" y="182" fill="#12171d" stroke="#30363d" rx="10"/><text x="75" y="209" fill="#8b949e">Mobile · later</text></g><path id="surface-thread" fill="none" stroke="#58a6ff" stroke-dasharray="5 7" stroke-width="2" d="M242 80 C300 80 294 145 350 145"><animate attributeName="stroke-dashoffset" dur="1.4s" from="24" repeatCount="indefinite" to="0"/></path><path fill="none" stroke="#39424e" stroke-dasharray="3 8" stroke-width="1.4" d="M242 142 C300 142 294 145 350 145M242 204 C300 204 294 145 350 145"/><g opacity="0"><animate fill="freeze" attributeName="opacity" begin=".25s" dur=".45s" from="0" to="1"/><rect width="500" height="206" x="350" y="42" fill="#151a21" stroke="#4b5563" rx="15"/><text x="380" y="77" fill="#f0f3f6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">Heddlework workspace core</text><text x="380" y="99" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">ONE HUMAN-VISIBLE CONTROL PLANE</text><rect width="134" height="46" x="380" y="122" fill="#0f141a" stroke="#2f3844" rx="9"/><rect width="134" height="46" x="533" y="122" fill="#0f141a" stroke="#2f3844" rx="9"/><rect width="134" height="46" x="686" y="122" fill="#0f141a" stroke="#2f3844" rx="9"/><text x="447" y="150" fill="#c9d1d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Sessions</text><text x="600" y="150" fill="#c9d1d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Work graph</text><text x="753" y="150" fill="#c9d1d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Review</text><line x1="380" x2="820" y1="191" y2="191" stroke="#2d3641"/><text x="380" y="218" fill="#8993a0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">projects · schedules · checkout lanes · receipts · artifacts · notifications</text></g><path id="adapter-thread" fill="none" stroke="#8b5cf6" stroke-dasharray="5 7" stroke-width="2" d="M850 145 C900 145 904 82 954 82"><animate attributeName="stroke-dashoffset" dur="1.3s" from="24" repeatCount="indefinite" to="0"/></path><path fill="none" stroke="#3b4552" stroke-dasharray="3 8" stroke-width="1.4" d="M850 145 C900 145 904 145 954 145M850 145 C900 145 904 208 954 208"/><text x="954" y="39" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">HARNESS ADAPTERS</text><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14"><rect width="194" height="48" x="954" y="58" fill="#191526" stroke="#8b5cf6" stroke-opacity=".7" rx="10"/><circle cx="977" cy="82" r="5" fill="#8b5cf6"/><text x="993" y="87" fill="#e6edf3">Pi · available</text><rect width="194" height="48" x="954" y="121" fill="#12171d" stroke="#30363d" rx="10"/><circle cx="977" cy="145" r="5" fill="#58a6ff" opacity=".6"/><text x="993" y="150" fill="#8b949e">Codex · planned</text><rect width="194" height="48" x="954" y="184" fill="#12171d" stroke="#30363d" rx="10"/><circle cx="977" cy="208" r="5" fill="#e3b341" opacity=".6"/><text x="993" y="213" fill="#8b949e">Claude · planned</text></g><g filter="url(#pulse)"><circle r="3.5" fill="#58a6ff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#surface-thread"/></animateMotion></circle><circle r="3.5" fill="#8b5cf6"><animateMotion begin=".7s" dur="2.2s" repeatCount="indefinite"><mpath href="#adapter-thread"/></animateMotion></circle></g><text x="600" y="275" fill="#626c78" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" text-anchor="middle">harnesses own execution · Heddlework owns the workspace projection</text></svg>