<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290">
  <title>Heddlework architecture — surfaces, workspace core, and harness adapters</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#27303b"/></pattern>
    <filter id="pulse" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="290" rx="14" fill="#0d1117"/>
  <rect width="1200" height="290" rx="14" fill="url(#dots)"/>

  <text x="52" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6e7681">SURFACES</text>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#d8dee4">
    <rect x="52" y="58" width="190" height="44" rx="10" fill="#161b22" stroke="#30363d"/><text x="75" y="85">Native desktop</text>
    <rect x="52" y="120" width="190" height="44" rx="10" fill="#12171d" stroke="#30363d"/><text x="75" y="147" fill="#8b949e">Web · planned</text>
    <rect x="52" y="182" width="190" height="44" rx="10" fill="#12171d" stroke="#30363d"/><text x="75" y="209" fill="#8b949e">Mobile · later</text>
  </g>

  <path id="surface-thread" d="M242 80 C300 80 294 145 350 145" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite"/></path>
  <path d="M242 142 C300 142 294 145 350 145M242 204 C300 204 294 145 350 145" fill="none" stroke="#39424e" stroke-width="1.4" stroke-dasharray="3 8"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".45s" begin=".25s" fill="freeze"/>
    <rect x="350" y="42" width="500" height="206" rx="15" fill="#151a21" stroke="#4b5563"/>
    <text x="380" y="77" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#f0f3f6">Heddlework workspace core</text>
    <text x="380" y="99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">ONE HUMAN-VISIBLE CONTROL PLANE</text>
    <rect x="380" y="122" width="134" height="46" rx="9" fill="#0f141a" stroke="#2f3844"/>
    <rect x="533" y="122" width="134" height="46" rx="9" fill="#0f141a" stroke="#2f3844"/>
    <rect x="686" y="122" width="134" height="46" rx="9" fill="#0f141a" stroke="#2f3844"/>
    <text x="447" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#c9d1d9">Sessions</text>
    <text x="600" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#c9d1d9">Work graph</text>
    <text x="753" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#c9d1d9">Review</text>
    <line x1="380" y1="191" x2="820" y2="191" stroke="#2d3641"/>
    <text x="380" y="218" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#8993a0">projects · schedules · checkout lanes · receipts · artifacts · notifications</text>
  </g>

  <path id="adapter-thread" d="M850 145 C900 145 904 82 954 82" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.3s" repeatCount="indefinite"/></path>
  <path d="M850 145 C900 145 904 145 954 145M850 145 C900 145 904 208 954 208" fill="none" stroke="#3b4552" stroke-width="1.4" stroke-dasharray="3 8"/>

  <text x="954" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6e7681">HARNESS ADAPTERS</text>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
    <rect x="954" y="58" width="194" height="48" rx="10" fill="#191526" stroke="#8b5cf6" stroke-opacity=".7"/><circle cx="977" cy="82" r="5" fill="#8b5cf6"/><text x="993" y="87" fill="#e6edf3">Pi · available</text>
    <rect x="954" y="121" width="194" height="48" rx="10" fill="#12171d" stroke="#30363d"/><circle cx="977" cy="145" r="5" fill="#58a6ff" opacity=".6"/><text x="993" y="150" fill="#8b949e">Codex · planned</text>
    <rect x="954" y="184" width="194" height="48" rx="10" fill="#12171d" stroke="#30363d"/><circle cx="977" cy="208" r="5" fill="#e3b341" opacity=".6"/><text x="993" y="213" fill="#8b949e">Claude · planned</text>
  </g>

  <g filter="url(#pulse)">
    <circle r="3.5" fill="#58a6ff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#surface-thread"/></animateMotion></circle>
    <circle r="3.5" fill="#8b5cf6"><animateMotion dur="2.2s" begin=".7s" repeatCount="indefinite"><mpath href="#adapter-thread"/></animateMotion></circle>
  </g>

  <text x="600" y="275" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#626c78">harnesses own execution · Heddlework owns the workspace projection</text>
</svg>
