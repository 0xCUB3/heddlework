name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: scripts/fetch-gpuix.sh
      - run: bun install --frozen-lockfile
      # Hosted macOS runners boot a 1024x768 virtual display, which clamps GPUIX test windows to tablet width.
      - run: ./scripts/ci-display.sh
      - run: bun run check
      - run: bun run build
      # Hosted macOS runners have retired the first CEF Views window on a profile switch and
      # then never created the replacement, which times the packaged smoke out. That showed up
      # when other macOS jobs were on the pool; a second launch against the same bundle has
      # passed. Keep the assertions; retry once.
      - name: Run bun run smoke:browser
        run: |
          set -euo pipefail
          if bun run smoke:browser; then
            exit 0
          fi
          echo "Packaged browser smoke failed once; retrying after CEF profile-switch teardown"
          bun run smoke:browser
