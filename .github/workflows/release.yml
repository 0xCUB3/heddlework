name: release

# Publishing a GitHub release (or pushing a v* tag) builds every desktop target, attaches the assets,
# and sends the iOS shell to TestFlight when Apple secrets are present.
on:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

# Creating a release also pushes its tag; keep one run per tag.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    # Tooling prereleases such as gpuix-* carry no app build; only v* tags produce desktop assets.
    if: startsWith(github.event.release.tag_name || github.ref_name, 'v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: heddlework-macos-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: heddlework-macos-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: heddlework-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            asset: heddlework-windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: scripts/fetch-gpuix.sh
        shell: bash
      - run: bun install --frozen-lockfile
      - name: Widen the virtual display for GPUIX test windows
        if: runner.os == 'macOS'
        run: ./scripts/ci-display.sh
      - name: Run checks
        if: runner.os != 'Windows'
        run: bun run check
      # Windows path handling in a few suites is unsettled in CI; keep the release gate to typecheck plus the non-path suites there.
      - name: Run checks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bun run typecheck && bun test $(ls tests/*.test.ts | grep -vE 'rpc-transport|session-switch|session-history-controller|theme-manager|extension-ui|browser-service')
      # The vendored patched GPUix carries a CEF-enabled darwin-arm64 addon only; other targets build browser-free.
      - run: bun run build
        env:
          COMPILE_TARGET: ${{ matrix.target }}
          HEDDLEWORK_VERSION: ${{ env.RELEASE_TAG }}
          HEDDLEWORK_WITHOUT_CEF: ${{ matrix.target == 'bun-darwin-arm64' && '0' || '1' }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_CERT_P12:-}" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p tmp "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p tmp "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN"
            export SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' 'NR==1{print $2}')"
          fi
          ./packaging/macos/build-app.sh dist/heddlework dist/Heddlework.app "${VERSION#v}"
          suffix=""
          if [ -z "${SIGN_IDENTITY:-}" ]; then suffix="-unsigned"; fi
          ditto -c -k --keepParent dist/Heddlework.app "dist/${{ matrix.asset }}${suffix}.zip"
          if [ -n "${SIGN_IDENTITY:-}" ] && [ -n "${ASC_KEY_P8:-}" ]; then
            echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit "dist/${{ matrix.asset }}.zip" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple dist/Heddlework.app
            rm -f "dist/${{ matrix.asset }}.zip"
            ditto -c -k --keepParent dist/Heddlework.app "dist/${{ matrix.asset }}.zip"
          fi
          rm -rf dist/Heddlework.app

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p stage/heddlework
          cp dist/heddlework stage/heddlework/
          cp -r dist/web stage/heddlework/web
          cp -r packaging/linux stage/heddlework/packaging
          tar -C stage -czf "dist/${{ matrix.asset }}.tar.gz" heddlework

      - name: Package deb and rpm
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.43.1/nfpm_2.43.1_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" nfpm
          mkdir -p stage/pkg
          sed 's|@HEDDLEWORK_EXEC@|heddlework|' packaging/linux/io.github.monotykamary.heddlework.desktop > stage/pkg/io.github.monotykamary.heddlework.desktop
          version="${VERSION#v}"
          for fmt in deb rpm; do
            HEDDLEWORK_VERSION="$version" "$RUNNER_TEMP/nfpm" package --config packaging/linux/nfpm.yaml --packager "$fmt" --target "dist/heddlework-linux-x64.$fmt"
          done
          ls -la dist/*.deb dist/*.rpm

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = ''
          if ($env:WINDOWS_CERT_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD dist\heddlework.exe
          } else {
            $suffix = '-unsigned'
          }
          New-Item -ItemType Directory -Force stage\heddlework | Out-Null
          Copy-Item dist\heddlework.exe stage\heddlework\
          Copy-Item -Recurse dist\web stage\heddlework\web
          Copy-Item packaging\windows\README.md stage\heddlework\
          Compress-Archive -Path stage\heddlework -DestinationPath "dist\${{ matrix.asset }}$suffix.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  ios:
    name: ios (TestFlight)
    if: startsWith(github.event.release.tag_name || github.ref_name, 'v')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Use a release Xcode (App Store Connect rejects beta builds)
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Check for Apple secrets
        id: creds
        env:
          HAS_CERT: ${{ secrets.APPLE_DIST_CERT_P12 != '' }}
          HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" = true ] && [ "$HAS_KEY" = true ] && [ "$HAS_PROFILE" = true ]; then echo ready=true >> "$GITHUB_OUTPUT"; else echo "::notice::Skipping TestFlight upload; APPLE_DIST_CERT_P12, ASC_KEY_P8, or IOS_PROFILE_BASE64 is not set"; echo ready=false >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          bun-version: 1.4.0
      - name: Build web client and generate the Xcode project
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          scripts/fetch-gpuix.sh
          bun install --frozen-lockfile
          bun run build:web
          test -f dist/web/index.html
          brew install xcodegen
          cd packaging/ios && xcodegen generate
      - name: Archive and upload to TestFlight
        if: steps.creds.outputs.ready == 'true'
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: ./packaging/ios/ci-testflight.sh

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" assets/* --title "Heddlework $TAG" --generate-notes $prerelease
          fi

  # Homebrew cask, Scoop manifest, and winget PR. Stable tags only; prereleases stay on GitHub releases.
  packages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Render the cask and Scoop manifest
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum * > ../checksums.txt)
          scripts/release-packages.sh "$TAG" checksums.txt --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: dist/packages/
      - name: Push to the Homebrew tap and Scoop bucket
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          TAG: ${{ env.RELEASE_TAG }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGES_TOKEN:-}" ]; then echo "::notice::PACKAGES_TOKEN is not set; skipping tap and bucket update"; exit 0; fi
          scripts/release-packages.sh "$TAG" checksums.txt
      - name: Open a winget-pkgs pull request
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          TAG: ${{ env.RELEASE_TAG }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WINGET_TOKEN:-}" ]; then echo "::notice::WINGET_TOKEN is not set; skipping winget"; exit 0; fi
          version="${TAG#v}"
          asset=heddlework-windows-x64.zip
          [ -f "assets/$asset" ] || asset=heddlework-windows-x64-unsigned.zip
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$asset"
          komac_ver=2.16.0
          curl -sSL "https://github.com/russellbanks/Komac/releases/download/v$komac_ver/komac-$komac_ver-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          komac="$(find "$RUNNER_TEMP" -type f -name komac | head -1)"
          if "$komac" show 0xCUB3.Heddlework --token "$WINGET_TOKEN" >/dev/null 2>&1; then
            "$komac" update 0xCUB3.Heddlework --version "$version" --urls "$url" --submit --token "$WINGET_TOKEN"
          else
            echo "::notice::0xCUB3.Heddlework is not in winget-pkgs yet; create the first manifest with 'komac new 0xCUB3.Heddlework --version $version --urls $url --submit' once, then this step keeps it updated"
          fi
