name: release

# Publishing a GitHub release (or pushing a v* tag) builds every desktop target, attaches the assets,
# and sends the iOS shell to TestFlight when Apple secrets are present.
on:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: heddlework-macos-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: heddlework-macos-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: heddlework-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            asset: heddlework-windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Widen the virtual display for GPUIX test windows
        if: runner.os == 'macOS'
        run: ./scripts/ci-display.sh
      - name: Run checks
        if: runner.os != 'Windows'
        run: bun run check
      # Windows path handling in a few suites is unsettled in CI; keep the release gate to typecheck plus the non-path suites there.
      - name: Run checks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bun run typecheck && bun test $(ls tests/*.test.ts | grep -vE 'rpc-transport|session-switch|session-history-controller|theme-manager|extension-ui')
      - run: bun run build
        env:
          COMPILE_TARGET: ${{ matrix.target }}
          HEDDLEWORK_VERSION: ${{ env.RELEASE_TAG }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_CERT_P12:-}" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p tmp "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p tmp "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN"
            export SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' 'NR==1{print $2}')"
          fi
          ./packaging/macos/build-app.sh dist/heddlework dist/Heddlework.app "${VERSION#v}"
          suffix=""
          if [ -z "${SIGN_IDENTITY:-}" ]; then suffix="-unsigned"; fi
          ditto -c -k --keepParent dist/Heddlework.app "dist/${{ matrix.asset }}${suffix}.zip"
          if [ -n "${SIGN_IDENTITY:-}" ] && [ -n "${APPLE_ID:-}" ]; then
            xcrun notarytool submit "dist/${{ matrix.asset }}.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple dist/Heddlework.app
            rm -f "dist/${{ matrix.asset }}.zip"
            ditto -c -k --keepParent dist/Heddlework.app "dist/${{ matrix.asset }}.zip"
          fi
          rm -rf dist/Heddlework.app

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p stage/heddlework
          cp dist/heddlework stage/heddlework/
          cp -r dist/web stage/heddlework/web
          cp -r packaging/linux stage/heddlework/packaging
          tar -C stage -czf "dist/${{ matrix.asset }}.tar.gz" heddlework

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = ''
          if ($env:WINDOWS_CERT_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD dist\heddlework.exe
          } else {
            $suffix = '-unsigned'
          }
          New-Item -ItemType Directory -Force stage\heddlework | Out-Null
          Copy-Item dist\heddlework.exe stage\heddlework\
          Copy-Item -Recurse dist\web stage\heddlework\web
          Copy-Item packaging\windows\README.md stage\heddlework\
          Compress-Archive -Path stage\heddlework -DestinationPath "dist\${{ matrix.asset }}$suffix.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  ios:
    name: ios (TestFlight)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Use a release Xcode (App Store Connect rejects beta builds)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app && xcodebuild -version
      - name: Check for Apple secrets
        id: creds
        env:
          HAS_CERT: ${{ secrets.APPLE_DIST_CERT_P12 != '' }}
          HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" = true ] && [ "$HAS_KEY" = true ] && [ "$HAS_PROFILE" = true ]; then echo ready=true >> "$GITHUB_OUTPUT"; else echo "::notice::Skipping TestFlight upload; APPLE_DIST_CERT_P12, ASC_KEY_P8, or IOS_PROFILE_BASE64 is not set"; echo ready=false >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          bun-version: 1.4.0
      - name: Build web client and generate the Xcode project
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:web
          test -f dist/web/index.html
          brew install xcodegen
          cd packaging/ios && xcodegen generate
      - name: Archive and upload to TestFlight
        if: steps.creds.outputs.ready == 'true'
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: ./packaging/ios/ci-testflight.sh

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" assets/* --title "Heddlework $TAG" --generate-notes $prerelease
          fi
