name: release-windows

# Rebuilds the Windows zip for an existing v* tag without moving that tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (bun-windows-x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: scripts/fetch-gpuix.sh
        shell: bash
      - run: bun install --frozen-lockfile
      - name: Run checks (Windows)
        shell: bash
        run: bun run typecheck && bun test $(ls tests/*.test.ts | grep -vE 'rpc-transport|session-switch|session-history-controller|theme-manager|extension-ui|browser-service|terminal-pty|update-service|live-refresh-race|pi-terminal-attach|pi-transport-selection|runtime-bootstrap|image-hydration-worker-packaging|runtime-upgrade')
      - run: bun run build
        env:
          COMPILE_TARGET: bun-windows-x64
          HEDDLEWORK_VERSION: ${{ inputs.tag }}
          HEDDLEWORK_WITHOUT_CEF: '1'
      - name: Package Windows zip
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = ''
          if ($env:WINDOWS_CERT_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD dist\heddlework.exe
          } else {
            $suffix = '-unsigned'
          }
          New-Item -ItemType Directory -Force stage\heddlework | Out-Null
          Copy-Item dist\heddlework.exe stage\heddlework\
          Copy-Item -Recurse dist\web stage\heddlework\web
          Copy-Item packaging\windows\README.md stage\heddlework\
          Compress-Archive -Path stage\heddlework -DestinationPath "dist\heddlework-windows-x64$suffix.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: heddlework-windows-x64
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.zip --clobber
