packages:
  - '.'

# These exact releases were reviewed during the migration and intentionally bypass pnpm's age gate.
minimumReleaseAgeExclude:
  - '@gpuix/native-darwin-arm64@0.6.0'
  - '@gpuix/native-linux-x64-gnu@0.6.0'
  - '@gpuix/native-win32-x64-msvc@0.6.0'
  - '@gpuix/native@0.6.0'
  - '@gpuix/react@0.6.0'
  - '@types/node@26.4.0'

# GPUIX's JSX declarations import React types without declaring the type peer.
packageExtensions:
  '@gpuix/react@0.6.0':
    peerDependencies:
      '@types/react': '>=18'
  '@mathjax/mathjax-newcm-font@4.1.3':
    peerDependencies:
      '@mathjax/src': '>=4'
