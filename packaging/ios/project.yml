name: Heddlework
options:
  bundleIdPrefix: com.0xCUBE
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DNP7DGUB7B
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Heddlework:
    type: application
    platform: iOS
    sources:
      - path: Heddlework
      - path: ../../dist/web
        type: folder
        buildPhase: resources
        name: web
    info:
      path: Heddlework/Info.plist
      properties:
        CFBundleDisplayName: Heddlework
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Heddlework scans the QR code your Mac prints to connect to it.
        NSLocalNetworkUsageDescription: Heddlework connects to the workspace host running on your Mac over the local network.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: com.0xCUBE.Heddlework.connect
            CFBundleURLSchemes: [heddlework]
    entitlements:
      path: Heddlework/Heddlework.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xCUBE.Heddlework
        PRODUCT_NAME: Heddlework
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Check web bundle
        script: |
          if [ ! -f "$SRCROOT/../../dist/web/index.html" ]; then
            echo "error: dist/web/index.html is missing. Run 'bun run build:web' at the repository root before building the iOS shell."
            exit 1
          fi
        basedOnDependencyAnalysis: false
  HeddleworkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HeddleworkTests
    dependencies:
      - target: Heddlework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xCUBE.HeddleworkTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Heddlework:
    build:
      targets:
        Heddlework: all
        HeddleworkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeddleworkTests
    archive:
      config: Release
