name: Heddlework
options:
  bundleIdPrefix: com.0xCUBE
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DNP7DGUB7B
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Heddlework:
    type: application
    platform: iOS
    sources:
      - path: Heddlework
      - path: ../../src/workbench/ui-contract.json
        buildPhase: resources
        name: ui-contract.json
    info:
      path: Heddlework/Info.plist
      properties:
        CFBundleDisplayName: Heddlework
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Heddlework scans the QR code your Mac prints to connect to it.
        NSLocalNetworkUsageDescription: Heddlework connects to the workspace host running on your Mac over the local network.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.0xCUBE.Heddlework.connect
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [heddlework]
    entitlements:
      path: Heddlework/Heddlework.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xCUBE.Heddlework
        PRODUCT_NAME: Heddlework
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HeddleworkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HeddleworkTests
    dependencies:
      - target: Heddlework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xCUBE.HeddleworkTests
        GENERATE_INFOPLIST_FILE: YES
  HeddleworkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HeddleworkUITests
    dependencies:
      - target: Heddlework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xCUBE.HeddleworkUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Heddlework
schemes:
  Heddlework:
    build:
      targets:
        Heddlework: all
        HeddleworkTests: [test]
        HeddleworkUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeddleworkTests
        - HeddleworkUITests
    archive:
      config: Release
