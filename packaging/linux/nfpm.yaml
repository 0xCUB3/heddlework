# nfpm config for the Linux .deb and .rpm packages. The release workflow runs this after `bun run build`.
name: heddlework
arch: amd64
platform: linux
version: ${HEDDLEWORK_VERSION}
section: devel
priority: optional
maintainer: Alexander Skula <alex@0xcube.dev>
description: |
  Native, harness-neutral workspace for agent sessions, task graphs, diffs, and durable work.
vendor: Heddlework
homepage: https://github.com/0xCUB3/heddlework
license: MIT
contents:
  # The binary and the web client live together because the host looks for `web/` next to the executable.
  - src: ./dist/heddlework
    dst: /usr/lib/heddlework/heddlework
    file_info:
      mode: 0755
  - src: ./dist/web
    dst: /usr/lib/heddlework/web
  - src: ./packaging/linux/heddlework-launcher
    dst: /usr/bin/heddlework
    file_info:
      mode: 0755
  - src: ./stage/pkg/io.github.monotykamary.heddlework.desktop
    dst: /usr/share/applications/io.github.monotykamary.heddlework.desktop
  - src: ./media/heddlework-icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.monotykamary.heddlework.svg
  # Raster sizes for desktops that do not render SVG icons (older GNOME shells, some panels); scripts/generate-icons.ts makes them.
  - src: ./packaging/linux/icons/16.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.monotykamary.heddlework.png
  - src: ./packaging/linux/icons/32.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.monotykamary.heddlework.png
  - src: ./packaging/linux/icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.monotykamary.heddlework.png
  - src: ./packaging/linux/icons/64.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.monotykamary.heddlework.png
  - src: ./packaging/linux/icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.monotykamary.heddlework.png
  - src: ./packaging/linux/icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.monotykamary.heddlework.png
  - src: ./packaging/linux/icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.monotykamary.heddlework.png
  - src: ./LICENSE
    dst: /usr/share/doc/heddlework/copyright
